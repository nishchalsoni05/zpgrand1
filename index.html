<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel ZP Grand | Biswanath Sutar</title>
  <meta name="description" content="Hotel ZP Grand — Luxury • Comfort • Class. Biswanath Sutar (General Manager). Contact via phone, email, Google Maps, WhatsApp, or Instagram.">
  
  <!-- Google Fonts: Cinzel (Luxury Serif) & Plus Jakarta Sans (Clean Modern) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-wrapper">
    <main class="profile-card">
      
      <!-- Hotel ZP Grand Profile Section -->
      <section class="profile-section">
        
        <!-- Hotel Crest / Logo Badge -->
        <div class="profile-avatar-wrapper">
          <img src="image.png" alt="Hotel ZP Grand Logo" class="profile-avatar-img">
        </div>

        <!-- Hotel Name -->
        <h1 class="profile-title">Hotel ZP Grand</h1>

        <!-- General Manager Designation -->
        <p class="profile-subtitle">BISWANATH SUTAR ( General Manager)</p>

        <!-- Direct Phone Number (Clickable to open dialer) -->
        <div class="profile-phone">
          <a href="tel:+919183692611" class="profile-phone-link" aria-label="Call +91 9183692611">+91 9183692611</a>
        </div>

        <!-- Elegant Golden Divider -->
        <div class="profile-divider" aria-hidden="true">
          <span class="divider-line"></span>
          <span class="divider-diamond">&#9670;</span>
          <span class="divider-line"></span>
        </div>
      </section>

      <!-- Five Gold/Brown Ribbon Links -->
      <section class="links-section">
        
        <!-- Link 1: Call Us! (Direct Mobile Call on Android & iOS) -->
        <a href="tel:+919183692611" 
           class="link-button" 
           id="btn-call"
           aria-label="Call Us: +91 9183692611">
          <div class="link-icon-container">
            <img src="call.svg" alt="Phone Call" class="link-icon">
          </div>
          <span class="link-text">Call Us!</span>
        </a>

        <!-- Link 2: Mail Us (Direct Gmail / Email) -->
        <a href="mailto:gm@zpgrandhotels.com" 
           class="link-button" 
           id="btn-mail"
           aria-label="Mail Us: gm@zpgrandhotels.com">
          <div class="link-icon-container">
            <img src="gmail.svg" alt="Gmail" class="link-icon">
          </div>
          <span class="link-text">Mail Us</span>
        </a>

        <!-- Link 3: Locate Us (Google Maps Location) -->
        <a href="https://www.google.com/maps?q=place_id:ChIJxTTRH2sjKToREz0qtaLJM90" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="link-button" 
           id="btn-locate"
           aria-label="Locate Hotel ZP Grand on Google Maps">
          <div class="link-icon-container">
            <img src="maps.svg" alt="Google Maps" class="link-icon">
          </div>
          <span class="link-text">Locate Us</span>
        </a>

        <!-- Link 4: Send Message Directly (WhatsApp) -->
        <a href="https://wa.me/919183692611" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="link-button" 
           id="btn-whatsapp"
           aria-label="Send Message Directly on WhatsApp">
          <div class="link-icon-container">
            <img src="whatsapp.svg" alt="WhatsApp" class="link-icon">
          </div>
          <span class="link-text">Send Message Directly</span>
        </a>

        <!-- Link 5: Check Our Instagram Profile -->
        <a href="https://www.instagram.com/hotel.zp.grand" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="link-button" 
           id="btn-instagram"
           aria-label="Check Our Instagram Profile">
          <div class="link-icon-container">
            <img src="instagram.svg" alt="Instagram" class="link-icon">
          </div>
          <span class="link-text">Check Our Instagram Profile</span>
        </a>

      </section>

      <!-- SoberStuds NFC Branding Footer -->
      <footer class="card-footer">
        <a href="https://wa.me/919243334046?text=Hey%20I%20want%20to%20enquire%20about%20tap%20to%20review%20product" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="footer-brand-container"
           aria-label="Enquire about tap to review product on WhatsApp"
           title="Enquire on WhatsApp: Hey I want to enquire about tap to review product">
          <img src="logo.png" alt="SoberStuds" class="footer-full-logo">
        </a>
      </footer>

    </main>
  </div>
</body>
</html>
